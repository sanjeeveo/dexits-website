<script>
(function(){

  const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  window.DEXITS_POSTS.forEach(p=>{
    const a=document.createElement('a');
    a.className='post-card';a.href=p.slug+'.html';
    a.innerHTML='<div class="post-meta">'+p.tag+' · '+p.minutes+' min read</div>'+
      '<h2>'+p.title+'</h2><p>'+p.description+'</p>'+
      '<span class="more">Read article →</span><span class="date">'+fmt(p.date)+'</span>';
    grid.appendChild(a);
  });
})();
